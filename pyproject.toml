[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueboard-boss-katana-pedalboard"
version = "0.8.0"
description = "iRig BlueBoard to BOSS Katana MIDI bridge"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abraham Jhared Flores Azcona"}]
dependencies = ["bleak>=1.0,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.optional-dependencies]
katana = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9", "setuptools>=77", "wheel"]

[project.scripts]
blueboard-katana = "blueboard_macro_handler.cli:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["blueboard_macro_handler*"]

[tool.setuptools.package-data]
blueboard_macro_handler = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]
python_files = ["test*.py"]
python_classes = ["*Tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
