name: Python validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m unittest discover -s python/tests -p "test*.py"
      - run: ruff check python/src/blueboard_macro_handler python/tests

  package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install built wheel
        shell: pwsh
        run: |
          python -m venv .wheel-test
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          .\.wheel-test\Scripts\python.exe -m pip install $wheel
      - name: Smoke-test installed wheel
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .\.wheel-test\Scripts\blueboard-katana.exe)) {
            throw "Wheel did not install the blueboard-katana console entry point."
          }
          .\.wheel-test\Scripts\python.exe -m blueboard_macro_handler --version
          .\.wheel-test\Scripts\python.exe -m blueboard_macro_handler validate --config python\config\blueboard.json
          .\.wheel-test\Scripts\python.exe -m blueboard_macro_handler replay python\tests\fixtures\blueboardPackets.json
